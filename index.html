<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Community Leading Talent</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧚‍♀️</text></svg>">
  <style>
    :root {
      --cgi-red: #E2001A;
      --cgi-red-dark: #b5001a;
      --cgi-black: #1a1a1a;
      --cgi-grey-dark: #3a3a3a;
      --cgi-grey-mid: #6b6b6b;
      --cgi-grey-light: #d0d0d0;
      --cgi-grey-bg: #f2f2f2;
      --cgi-white: #ffffff;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: var(--cgi-grey-bg);
      color: var(--cgi-black);
      min-height: 100vh;
    }

    header {
      background: var(--cgi-black);
      padding: 12px 28px;
      display: flex;
      align-items: center;
      gap: 18px;
      border-bottom: 4px solid var(--cgi-red);
    }

    header img {
      height: 40px;
    }

    header h1 {
      color: var(--cgi-white);
      font-size: 1.3rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      flex: 1;
    }

    .header-actions {
      display: flex;
      gap: 10px;
    }

    .btn-header {
      padding: 7px 16px;
      border-radius: 5px;
      font-size: 0.82rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      letter-spacing: 0.04em;
      transition: background 0.15s, color 0.15s;
    }

    .btn-export {
      background: none;
      border: 1px solid var(--cgi-grey-mid);
      color: var(--cgi-grey-light);
    }

    .btn-export:hover {
      background: var(--cgi-grey-dark);
      color: var(--cgi-white);
    }

    .btn-import {
      background: var(--cgi-red);
      border: 1px solid var(--cgi-red);
      color: var(--cgi-white);
    }

    .btn-import:hover {
      background: var(--cgi-red-dark);
      border-color: var(--cgi-red-dark);
    }

    .board {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      padding: 24px;
      max-width: 1400px;
      margin: 0 auto;
    }

    .column {
      background: var(--cgi-white);
      border-radius: 8px;
      border-top: 5px solid var(--cgi-grey-mid);
      box-shadow: 0 2px 8px rgba(0,0,0,0.10);
      display: flex;
      flex-direction: column;
    }

    .column[data-col="signals"] { border-top-color: var(--cgi-grey-mid); }
    .column[data-col="options"]  { border-top-color: var(--cgi-grey-dark); }
    .column[data-col="actions"]  { border-top-color: var(--cgi-red); }

    .col-header {
      padding: 14px 16px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--cgi-grey-light);
    }

    .col-header h2 {
      font-size: 0.95rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .column[data-col="signals"] .col-header h2 { color: var(--cgi-grey-mid); }
    .column[data-col="options"]  .col-header h2 { color: var(--cgi-grey-dark); }
    .column[data-col="actions"]  .col-header h2 { color: var(--cgi-red); }

    .col-desc {
      font-size: 0.75rem;
      color: var(--cgi-grey-mid);
      padding: 6px 16px 10px;
      font-style: italic;
    }

    .card-list {
      flex: 1;
      min-height: 80px;
      padding: 8px 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .card-list.drag-over {
      background: #ffeaea;
      border-radius: 4px;
    }

    .card {
      background: var(--cgi-grey-bg);
      border: 1px solid var(--cgi-grey-light);
      border-left: 4px solid var(--cgi-grey-light);
      border-radius: 6px;
      padding: 10px 12px;
      cursor: grab;
      position: relative;
      transition: box-shadow 0.15s, transform 0.1s;
      user-select: none;
    }

    .card:active { cursor: grabbing; }

    .card.dragging {
      opacity: 0.4;
      transform: scale(0.97);
    }

    .column[data-col="signals"] .card { border-left-color: var(--cgi-grey-mid); }
    .column[data-col="options"]  .card { border-left-color: var(--cgi-grey-dark); }
    .column[data-col="actions"]  .card { border-left-color: var(--cgi-red); }

    .card:hover { box-shadow: 0 3px 10px rgba(0,0,0,0.13); }

    .card .card-text {
      font-size: 0.9rem;
      color: var(--cgi-black);
      line-height: 1.4;
    }

    .card .card-name {
      font-weight: 700;
      font-size: 0.95rem;
      margin-bottom: 3px;
    }

    .card .card-desc {
      font-size: 0.82rem;
      color: var(--cgi-grey-dark);
      margin-bottom: 4px;
      line-height: 1.4;
    }

    .card .card-timeframe {
      display: inline-block;
      font-size: 0.72rem;
      background: var(--cgi-red);
      color: var(--cgi-white);
      border-radius: 3px;
      padding: 1px 7px;
      margin-top: 2px;
      font-weight: 600;
      letter-spacing: 0.03em;
    }

    .card .delete-btn {
      position: absolute;
      top: 6px;
      right: 8px;
      background: none;
      border: none;
      color: var(--cgi-grey-light);
      font-size: 1rem;
      cursor: pointer;
      line-height: 1;
      padding: 0 2px;
      border-radius: 3px;
      transition: color 0.15s;
    }

    .card .delete-btn:hover { color: var(--cgi-red); }

    .card .edit-btn {
      position: absolute;
      top: 6px;
      right: 30px;
      background: none;
      border: none;
      color: var(--cgi-grey-light);
      font-size: 0.85rem;
      cursor: pointer;
      line-height: 1;
      padding: 0 2px;
      border-radius: 3px;
      transition: color 0.15s;
    }

    .card .edit-btn:hover { color: var(--cgi-grey-dark); }

    .add-area {
      padding: 8px 12px 14px;
    }

    .add-btn {
      width: 100%;
      padding: 8px;
      border: 2px dashed var(--cgi-grey-light);
      border-radius: 6px;
      background: none;
      color: var(--cgi-grey-mid);
      font-size: 0.85rem;
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s, background 0.15s;
      font-weight: 500;
    }

    .add-btn:hover {
      border-color: var(--cgi-red);
      color: var(--cgi-red);
      background: #fff0f1;
    }

    /* Modal */
    .modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.45);
      z-index: 100;
      align-items: center;
      justify-content: center;
    }

    .modal-backdrop.open { display: flex; }

    .modal {
      background: var(--cgi-white);
      border-radius: 10px;
      padding: 28px 28px 22px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.22);
      border-top: 5px solid var(--cgi-red);
    }

    .modal h3 {
      font-size: 1rem;
      font-weight: 700;
      margin-bottom: 16px;
      color: var(--cgi-black);
      text-transform: uppercase;
      letter-spacing: 0.07em;
    }

    .modal label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--cgi-grey-dark);
      margin-bottom: 4px;
      margin-top: 10px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .modal input,
    .modal textarea,
    .modal select {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid var(--cgi-grey-light);
      border-radius: 5px;
      font-size: 0.9rem;
      color: var(--cgi-black);
      background: var(--cgi-grey-bg);
      font-family: inherit;
      resize: vertical;
    }

    .modal input:focus,
    .modal textarea:focus,
    .modal select:focus {
      outline: 2px solid var(--cgi-red);
      border-color: var(--cgi-red);
    }

    .modal-actions {
      display: flex;
      gap: 10px;
      margin-top: 20px;
      justify-content: flex-end;
    }

    .btn-cancel {
      padding: 8px 18px;
      border: 1px solid var(--cgi-grey-light);
      border-radius: 5px;
      background: none;
      color: var(--cgi-grey-dark);
      cursor: pointer;
      font-size: 0.88rem;
      font-family: inherit;
    }

    .btn-cancel:hover { background: var(--cgi-grey-bg); }

    .btn-save {
      padding: 8px 22px;
      border: none;
      border-radius: 5px;
      background: var(--cgi-red);
      color: var(--cgi-white);
      cursor: pointer;
      font-size: 0.88rem;
      font-weight: 600;
      font-family: inherit;
    }

    .btn-save:hover { background: var(--cgi-red-dark); }

    .lang-toggle {
      display: flex;
      gap: 0;
      border: 1px solid var(--cgi-grey-mid);
      border-radius: 5px;
      overflow: hidden;
    }

    .btn-lang {
      padding: 5px 12px;
      background: none;
      border: none;
      color: var(--cgi-grey-light);
      font-size: 0.78rem;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      letter-spacing: 0.06em;
      transition: background 0.15s, color 0.15s;
    }

    .btn-lang:not(:last-child) {
      border-right: 1px solid var(--cgi-grey-mid);
    }

    .btn-lang.active {
      background: var(--cgi-grey-dark);
      color: var(--cgi-white);
    }

    .btn-lang:not(.active):hover {
      background: rgba(255,255,255,0.08);
      color: var(--cgi-white);
    }

    .category-heading {
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--cgi-grey-dark);
      padding: 6px 4px 3px 4px;
      letter-spacing: 0.04em;
      border-bottom: 1px solid var(--cgi-grey-light);
      margin-top: 4px;
    }

    .column[data-col="signals"] .card .card-text {
      font-size: 0.68rem;
    }

    @media (max-width: 800px) {
      .board { grid-template-columns: 1fr; }
    }

    /* ── Print meta bar (hidden on screen) ─────────────────────── */
    .print-meta {
      display: none;
      padding: 8px 28px;
      background: var(--cgi-white);
      border-bottom: 1px solid var(--cgi-grey-light);
      font-size: 0.82rem;
      color: var(--cgi-grey-mid);
      justify-content: space-between;
      align-items: center;
    }

    /* ── Print styles ────────────────────────────────────────────── */
    @media print {
      * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }

      body { background: white; }

      .header-actions { display: none !important; }
      .add-area       { display: none; }
      .card .delete-btn,
      .card .edit-btn  { display: none; }
      .modal-backdrop  { display: none !important; }

      .print-meta {
        display: flex;
      }

      header {
        padding: 8px 20px;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }

      .board {
        display: block;
        padding: 12px 16px;
      }

      .column {
        display: block;
        width: 100%;
        margin-bottom: 24px;
        box-shadow: none;
        break-after: page;
      }

      .card {
        break-inside: avoid;
      }
    }
  </style>
</head>
<body>

<header>
  <img src="image.png" alt="CGI Logo" />
  <h1>Community Leading Talent</h1>
  <div class="header-actions">
    <div class="lang-toggle">
      <button class="btn-lang" id="btn-lang-fin" onclick="setLang('fi')">FIN</button>
      <button class="btn-lang" id="btn-lang-eng" onclick="setLang('en')">ENG</button>
    </div>
    <button class="btn-header btn-export" id="btn-print" onclick="printReport()">⎙ Print</button>
    <button class="btn-header btn-export" id="btn-export" onclick="exportData()">↓ Export</button>
    <button class="btn-header btn-import" id="btn-import" onclick="document.getElementById('import-input').click()">↑ Import</button>
    <input type="file" id="import-input" accept=".json" style="display:none" onchange="importData(event)" />
  </div>
</header>

<div class="print-meta">
  <span id="print-title"></span>
  <span id="print-date"></span>
</div>

<div class="board">
  <!-- Signals -->
  <div class="column" data-col="signals">
    <div class="col-header">
      <h2 data-i18n="col-signals"></h2>
    </div>
    <p class="col-desc" data-i18n="col-signals-desc"></p>
    <div class="card-list" id="list-signals"></div>
    <div class="add-area">
      <button class="add-btn" id="add-btn-signals" onclick="openModal('signals')"></button>
    </div>
  </div>

  <!-- Options -->
  <div class="column" data-col="options">
    <div class="col-header">
      <h2 data-i18n="col-options"></h2>
    </div>
    <p class="col-desc" data-i18n="col-options-desc"></p>
    <div class="card-list" id="list-options"></div>
    <div class="add-area">
      <button class="add-btn" id="add-btn-options" onclick="openModal('options')"></button>
    </div>
  </div>

  <!-- Actions -->
  <div class="column" data-col="actions">
    <div class="col-header">
      <h2 data-i18n="col-actions"></h2>
    </div>
    <p class="col-desc" data-i18n="col-actions-desc"></p>
    <div class="card-list" id="list-actions"></div>
    <div class="add-area">
      <button class="add-btn" id="add-btn-actions" onclick="openModal('actions')"></button>
    </div>
  </div>
</div>

<!-- Modal -->
<div class="modal-backdrop" id="modal-backdrop">
  <div class="modal">
    <h3 id="modal-title">Add Card</h3>

    <!-- Signal / Option fields -->
    <div id="fields-simple">
      <label for="input-text" data-i18n="lbl-text"></label>
      <input type="text" id="input-text" maxlength="200" />
    </div>

    <!-- Signal category -->
    <div id="fields-signal-category" style="display:none">
      <label for="input-category" data-i18n="lbl-category"></label>
      <input type="text" id="input-category" maxlength="80" />
    </div>

    <!-- Action fields -->
    <div id="fields-action" style="display:none">
      <label for="input-name" data-i18n="lbl-name"></label>
      <input type="text" id="input-name" maxlength="100" />
      <label for="input-desc" data-i18n="lbl-desc"></label>
      <textarea id="input-desc" rows="3"></textarea>
      <label for="input-timeframe" data-i18n="lbl-timeframe"></label>
      <input type="text" id="input-timeframe" maxlength="60" />
    </div>

    <div class="modal-actions">
      <button class="btn-cancel" id="btn-cancel" onclick="closeModal()"></button>
      <button class="btn-save" id="btn-save" onclick="saveCard()"></button>
    </div>
  </div>
</div>

<script>
  const STORAGE_KEY = 'leading-talent-cards';
  let state = { signals: [], options: [], actions: [] };
  let modalCol = null;
  let editId = null;
  let dragSrcId = null;
  let dragSrcCol = null;

  // ── i18n ──────────────────────────────────────────────────────────
  const LANG_STORAGE_KEY = 'leading-talent-lang';
  let lang = localStorage.getItem(LANG_STORAGE_KEY) || 'fi';

  const STRINGS = {
    fi: {
      'col-signals':      'Signaalit',
      'col-signals-desc': 'Asioita, joita ihmiset sanovat ja jotka saattavat olla vääristyneitä',
      'col-options':      'Vaihtoehdot',
      'col-options-desc': 'Ehdotuksia siitä, mitä voisimme tehdä',
      'col-actions':      'Toimenpiteet',
      'col-actions-desc': 'Valitut toimenpiteet',
      'add-signals':      '+ Lisää signaali',
      'add-options':      '+ Lisää vaihtoehto',
      'add-actions':      '+ Lisää toimenpide',
      'modal-signals':    'Lisää signaali',
      'modal-options':    'Lisää vaihtoehto',
      'modal-actions':    'Lisää toimenpide',
      'lbl-text':         'Teksti',
      'lbl-category':     'Kategoria',
      'lbl-name':         'Nimi',
      'lbl-desc':         'Kuvaus',
      'lbl-timeframe':    'Aikataulu',
      'ph-text':          'Kirjoita teksti…',
      'ph-category':      'esim. Palkka, Kulttuuri…',
      'ph-name':          'Toimenpiteen nimi…',
      'ph-desc':          'Kuvaile toimenpidettä…',
      'ph-timeframe':     'esim. Q3 2026, 2 viikkoa, kesäkuuhun mennessä…',
      'btn-cancel':       'Peruuta',
      'btn-save':         'Tallenna',
      'btn-export':       '↓ Vie',
      'btn-import':       '↑ Tuo',
      'btn-print':        '⎙ Tulosta',
      'print-title':      'Community Leading Talent — Raportti',
      'print-date-label': 'Tulostettu',
      'modal-edit-signals': 'Muokkaa signaalia',
      'modal-edit-options': 'Muokkaa vaihtoehtoa',
      'modal-edit-actions': 'Muokkaa toimenpidettä',
    },
    en: {
      'col-signals':      'Signals',
      'col-signals-desc': 'Things people say that may be distorted',
      'col-options':      'Options',
      'col-options-desc': 'Proposals of what we could do',
      'col-actions':      'Actions',
      'col-actions-desc': 'Selected actions to do',
      'add-signals':      '+ Add Signal',
      'add-options':      '+ Add Option',
      'add-actions':      '+ Add Action',
      'modal-signals':    'Add Signal',
      'modal-options':    'Add Option',
      'modal-actions':    'Add Action',
      'lbl-text':         'Text',
      'lbl-category':     'Category',
      'lbl-name':         'Name',
      'lbl-desc':         'Description',
      'lbl-timeframe':    'Timeframe',
      'ph-text':          'Enter text…',
      'ph-category':      'e.g. Compensation, Culture…',
      'ph-name':          'Action name…',
      'ph-desc':          'Describe the action…',
      'ph-timeframe':     'e.g. Q3 2026, 2 weeks, by June…',
      'btn-cancel':       'Cancel',
      'btn-save':         'Save',
      'btn-export':       '↓ Export',
      'btn-import':       '↑ Import',
      'btn-print':        '⎙ Print',
      'print-title':      'Community Leading Talent — Report',
      'print-date-label': 'Printed',
      'modal-edit-signals': 'Edit Signal',
      'modal-edit-options': 'Edit Option',
      'modal-edit-actions': 'Edit Action',
    }
  };

  function t(key) { return STRINGS[lang][key] || STRINGS['en'][key] || key; }

  function setLang(l) {
    lang = l;
    localStorage.setItem(LANG_STORAGE_KEY, lang);
    document.documentElement.lang = lang;
    applyLang();
  }

  function applyLang() {
    // Toggle button states
    document.getElementById('btn-lang-fin').classList.toggle('active', lang === 'fi');
    document.getElementById('btn-lang-eng').classList.toggle('active', lang === 'en');

    // data-i18n elements
    document.querySelectorAll('[data-i18n]').forEach(el => {
      el.textContent = t(el.dataset.i18n);
    });

    // Add buttons
    document.getElementById('add-btn-signals').textContent = t('add-signals');
    document.getElementById('add-btn-options').textContent  = t('add-options');
    document.getElementById('add-btn-actions').textContent  = t('add-actions');

    // Header buttons
    document.getElementById('btn-print').textContent  = t('btn-print');
    document.getElementById('btn-export').textContent = t('btn-export');
    document.getElementById('btn-import').textContent = t('btn-import');
    document.getElementById('print-title').textContent = t('print-title');

    // Modal buttons
    document.getElementById('btn-cancel').textContent = t('btn-cancel');
    document.getElementById('btn-save').textContent   = t('btn-save');

    // Placeholders
    document.getElementById('input-text').placeholder      = t('ph-text');
    document.getElementById('input-category').placeholder  = t('ph-category');
    document.getElementById('input-name').placeholder      = t('ph-name');
    document.getElementById('input-desc').placeholder      = t('ph-desc');
    document.getElementById('input-timeframe').placeholder = t('ph-timeframe');

    // Refresh modal title if open
    if (modalCol) {
      document.getElementById('modal-title').textContent = t('modal-' + modalCol);
    }
  }

  // ── Persistence ──────────────────────────────────────────────────
  function load() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) state = JSON.parse(raw);
    } catch(e) {}
    ['signals','options','actions'].forEach(c => { if (!Array.isArray(state[c])) state[c] = []; });
  }

  function save() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }

  // ── Rendering ────────────────────────────────────────────────────
  function render() {
    ['options','actions'].forEach(col => {
      const list = document.getElementById('list-' + col);
      list.innerHTML = '';
      state[col].forEach(card => list.appendChild(buildCard(card, col)));
      setupDropZone(list, col);
    });

    // Signals: group by category
    const sigList = document.getElementById('list-signals');
    sigList.innerHTML = '';
    const grouped = {};
    const uncategorized = [];
    state.signals.forEach(card => {
      if (card.category) {
        if (!grouped[card.category]) grouped[card.category] = [];
        grouped[card.category].push(card);
      } else {
        uncategorized.push(card);
      }
    });
    Object.keys(grouped).forEach(cat => {
      const heading = document.createElement('div');
      heading.className = 'category-heading';
      heading.textContent = cat;
      sigList.appendChild(heading);
      grouped[cat].forEach(card => sigList.appendChild(buildCard(card, 'signals')));
    });
    uncategorized.forEach(card => sigList.appendChild(buildCard(card, 'signals')));
    setupDropZone(sigList, 'signals');
  }

  function buildCard(card, col) {
    const el = document.createElement('div');
    el.className = 'card';
    el.draggable = true;
    el.dataset.id = card.id;
    el.dataset.col = col;

    if (col === 'actions') {
      el.innerHTML = `
        <button class="edit-btn" title="Edit" onclick="openEditModal('${col}','${card.id}')">✎</button>
        <button class="delete-btn" title="Delete" onclick="deleteCard('${col}','${card.id}')">✕</button>
        <div class="card-name">${esc(card.name)}</div>
        <div class="card-desc">${esc(card.desc)}</div>
        ${card.timeframe ? `<span class="card-timeframe">${esc(card.timeframe)}</span>` : ''}
      `;
    } else {
      el.innerHTML = `
        <button class="edit-btn" title="Edit" onclick="openEditModal('${col}','${card.id}')">✎</button>
        <button class="delete-btn" title="Delete" onclick="deleteCard('${col}','${card.id}')">✕</button>
        <div class="card-text">${esc(card.text)}</div>
      `;
    }

    el.addEventListener('dragstart', onDragStart);
    el.addEventListener('dragend', onDragEnd);
    return el;
  }

  function esc(str) {
    if (!str) return '';
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // ── Drag & Drop ──────────────────────────────────────────────────
  function onDragStart(e) {
    dragSrcId = e.currentTarget.dataset.id;
    dragSrcCol = e.currentTarget.dataset.col;
    e.currentTarget.classList.add('dragging');
    e.dataTransfer.effectAllowed = 'move';
  }

  function onDragEnd(e) {
    e.currentTarget.classList.remove('dragging');
    document.querySelectorAll('.card-list').forEach(l => l.classList.remove('drag-over'));
  }

  function setupDropZone(list, col) {
    list.addEventListener('dragover', e => {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      list.classList.add('drag-over');
    });
    list.addEventListener('dragleave', () => list.classList.remove('drag-over'));
    list.addEventListener('drop', e => {
      e.preventDefault();
      list.classList.remove('drag-over');
      if (!dragSrcId) return;
      moveCard(dragSrcCol, col, dragSrcId, e);
    });
  }

  function moveCard(fromCol, toCol, cardId, dropEvent) {
    const srcArr = state[fromCol];
    const idx = srcArr.findIndex(c => c.id === cardId);
    if (idx === -1) return;
    const card = srcArr[idx];

    // If moving to a different type column, adapt fields
    if (fromCol !== toCol) {
      if (toCol === 'actions' && !card.name) {
        // promote to action
        card.name = card.text || 'Unnamed action';
        card.desc = '';
        card.timeframe = '';
        delete card.text;
      } else if (toCol !== 'actions' && card.name !== undefined) {
        // demote to oneliner
        card.text = card.name + (card.desc ? ': ' + card.desc : '');
        delete card.name;
        delete card.desc;
        delete card.timeframe;
      }
    }

    srcArr.splice(idx, 1);

    // Insert at position based on drop target
    const destArr = state[toCol];
    const list = document.getElementById('list-' + toCol);
    const cards = [...list.querySelectorAll('.card')];
    let insertIdx = destArr.length;
    for (let i = 0; i < cards.length; i++) {
      const rect = cards[i].getBoundingClientRect();
      if (dropEvent.clientY < rect.top + rect.height / 2) {
        insertIdx = i;
        break;
      }
    }
    destArr.splice(insertIdx, 0, card);

    save();
    render();
  }

  // ── CRUD ─────────────────────────────────────────────────────────
  function deleteCard(col, id) {
    state[col] = state[col].filter(c => c.id !== id);
    save();
    render();
  }

  function uid() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  }

  // ── Modal ─────────────────────────────────────────────────────────
  function openModal(col) {
    modalCol = col;
    editId = null;
    document.getElementById('modal-title').textContent = t('modal-' + col);
    document.getElementById('fields-simple').style.display = col !== 'actions' ? '' : 'none';
    document.getElementById('fields-action').style.display = col === 'actions' ? '' : 'none';
    document.getElementById('fields-signal-category').style.display = col === 'signals' ? '' : 'none';
    document.getElementById('input-text').value = '';
    document.getElementById('input-name').value = '';
    document.getElementById('input-desc').value = '';
    document.getElementById('input-timeframe').value = '';
    document.getElementById('input-category').value = '';
    document.getElementById('modal-backdrop').classList.add('open');
    setTimeout(() => {
      (col === 'actions' ? document.getElementById('input-name') : document.getElementById('input-text')).focus();
    }, 50);
  }

  function openEditModal(col, id) {
    const card = state[col].find(c => c.id === id);
    if (!card) return;
    modalCol = col;
    editId = id;
    document.getElementById('modal-title').textContent = t('modal-edit-' + col);
    document.getElementById('fields-simple').style.display = col !== 'actions' ? '' : 'none';
    document.getElementById('fields-action').style.display = col === 'actions' ? '' : 'none';
    document.getElementById('fields-signal-category').style.display = col === 'signals' ? '' : 'none';
    if (col === 'actions') {
      document.getElementById('input-name').value = card.name || '';
      document.getElementById('input-desc').value = card.desc || '';
      document.getElementById('input-timeframe').value = card.timeframe || '';
    } else {
      document.getElementById('input-text').value = card.text || '';
      document.getElementById('input-category').value = card.category || '';
    }
    document.getElementById('modal-backdrop').classList.add('open');
    setTimeout(() => {
      (col === 'actions' ? document.getElementById('input-name') : document.getElementById('input-text')).focus();
    }, 50);
  }

  function closeModal() {
    document.getElementById('modal-backdrop').classList.remove('open');
    modalCol = null;
    editId = null;
  }

  function saveCard() {
    if (modalCol === 'actions') {
      const name = document.getElementById('input-name').value.trim();
      const desc = document.getElementById('input-desc').value.trim();
      const timeframe = document.getElementById('input-timeframe').value.trim();
      if (!name) { document.getElementById('input-name').focus(); return; }
      if (editId) {
        const card = state.actions.find(c => c.id === editId);
        if (card) { card.name = name; card.desc = desc; card.timeframe = timeframe; }
      } else {
        state.actions.push({ id: uid(), name, desc, timeframe });
      }
    } else {
      const text = document.getElementById('input-text').value.trim();
      if (!text) { document.getElementById('input-text').focus(); return; }
      if (editId) {
        const card = state[modalCol].find(c => c.id === editId);
        if (card) {
          card.text = text;
          if (modalCol === 'signals') {
            const category = document.getElementById('input-category').value.trim();
            if (category) card.category = category; else delete card.category;
          }
        }
      } else {
        const card = { id: uid(), text };
        if (modalCol === 'signals') {
          const category = document.getElementById('input-category').value.trim();
          if (category) card.category = category;
        }
        state[modalCol].push(card);
      }
    }
    save();
    render();
    closeModal();
  }

  // Enter to submit
  document.getElementById('modal-backdrop').addEventListener('keydown', e => {
    if (e.key === 'Escape') closeModal();
    if (e.key === 'Enter' && e.target.tagName !== 'TEXTAREA') saveCard();
  });

  // Click outside to close
  document.getElementById('modal-backdrop').addEventListener('click', e => {
    if (e.target === document.getElementById('modal-backdrop')) closeModal();
  });

  // ── Print ─────────────────────────────────────────────────────────
  function printReport() {
    const locale = lang === 'fi' ? 'fi-FI' : 'en-GB';
    const dateStr = new Date().toLocaleDateString(locale, { year: 'numeric', month: 'long', day: 'numeric' });
    document.getElementById('print-date').textContent = t('print-date-label') + ': ' + dateStr;
    window.print();
  }

  // ── Import / Export ───────────────────────────────────────────────
  function exportData() {
    const json = JSON.stringify(state, null, 2);
    const blob = new Blob([json], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'leading-talent-' + new Date().toISOString().slice(0,10) + '.json';
    a.click();
    URL.revokeObjectURL(url);
  }

  function importData(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      try {
        const parsed = JSON.parse(ev.target.result);
        if (parsed && typeof parsed === 'object') {
          state.signals = Array.isArray(parsed.signals) ? parsed.signals : [];
          state.options  = Array.isArray(parsed.options)  ? parsed.options  : [];
          state.actions  = Array.isArray(parsed.actions)  ? parsed.actions  : [];
          save();
          render();
        }
      } catch(err) {
        alert('Invalid JSON file.');
      }
    };
    reader.readAsText(file);
    e.target.value = '';
  }

  // ── Init ──────────────────────────────────────────────────────────
  load();
  applyLang();
  render();
</script>
</body>
</html>
